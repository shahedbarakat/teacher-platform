
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      max-width: 420px;
      width: 100%;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      color: #243b53;
      font-size: 24px;
    }

    p {
      color: #52606d;
      line-height: 1.8;
    }

    a {
      display: none;
      margin-top: 20px;
      padding: 13px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    #error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>استعادة كلمة المرور</h1>
    <p>
      اضغط على الزر أدناه لمتابعة استعادة كلمة المرور.
    </p>

    <a id="continueButton">متابعة استعادة كلمة المرور</a>
    <p id="error"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const confirmationUrl = params.get("confirmation_url");
    const button = document.getElementById("continueButton");
    const error = document.getElementById("error");

    if (confirmationUrl) {
      try {
        const targetUrl = new URL(confirmationUrl);

        if (targetUrl.protocol === "https:" || targetUrl.protocol === "http:") {
          button.href = targetUrl.href;
          button.style.display = "inline-block";
        } else {
          error.textContent = "الرابط غير صالح. اطلب رابط استعادة جديدًا.";
        }
      } catch {
        error.textContent = "الرابط غير صالح. اطلب رابط استعادة جديدًا.";
      }
    } else {
      error.textContent = "لم يتم العثور على رابط الاستعادة. افتح الرابط من البريد الإلكتروني مرة أخرى.";
    }
  </script>
</body>
</html>
